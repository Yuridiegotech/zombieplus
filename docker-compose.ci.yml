# docker-compose.ci.yml
# Arquivo de overlay usado na CI (GitHub Actions).

services:
  tests:
    container_name: zombieplus-tests
    build:
      context: .
      dockerfile: Dockerfile.tests
    working_dir: /src/tests
    volumes:
      - ./:/src
      - ../zombieplus:/src/tests
      - /tmp/ci-reports:/src/build/reports
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
      FRONT_URL: http://web:3000
      BASE_URL: http://web:3000
    depends_on:
      - database
      - app
      - web
    networks:
      - skynet
    command: sh -c "chmod +x /src/tests/gradlew && until curl -s http://app:3333/health; do echo 'waiting for API...'; sleep 2; done && until curl -s http://web:3000/ | grep -q '<!DOCTYPE html>'; do echo 'waiting for UI...'; sleep 2; done && ./gradlew test"

networks:
  skynet:
    driver: bridge
