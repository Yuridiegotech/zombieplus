# docker-compose.ci.yml
# Arquivo de overlay usado na CI (GitHub Actions).

services:
  tests:
    container_name: zombieplus-tests
    build:
      context: .
      dockerfile: Dockerfile.tests
    ipc: host
    shm_size: '2gb'
    working_dir: /src/tests
    volumes:
      - ./:/src
      - ../zombieplus:/src/tests
      - /tmp/ci-reports:/src/tests/build/reports
      - /tmp/ci-allure-results:/src/tests/build/allure-results
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
      FRONT_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:3333
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CI: "true"
    depends_on:
      - database
      - app
      - web
    networks:
      - skynet
    command: >
      sh -c "socat TCP-LISTEN:3333,fork,reuseaddr TCP:app:3333 &
             socat TCP-LISTEN:3000,fork,reuseaddr TCP:web:3000 &
             socat TCP-LISTEN:5432,fork,reuseaddr TCP:database:5432 &
             chmod +x /src/tests/gradlew &&
             until curl -s http://app:3333/health; do echo 'waiting for API...'; sleep 2; done &&
             until curl -s http://web:3000/ | grep -q 'Zombie+'; do echo 'waiting for UI...'; sleep 2; done &&
             xvfb-run -a ./gradlew test --info; TEST_STATUS=$$?; ./gradlew allureReport --info || true; exit $$TEST_STATUS"

networks:
  skynet:
    driver: bridge

