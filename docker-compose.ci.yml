# docker-compose.ci.yml
# Arquivo de overlay usado na CI (GitHub Actions).

services:
  tests:
    container_name: zombieplus-tests
    build:
      context: .
      dockerfile: Dockerfile.tests
    ipc: host
    shm_size: '2gb'
    working_dir: /src/tests
    volumes:
      - ../zombieplus:/src/tests
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: pwd123
      DB_NAME: zombieplus
      DB_DIALECT: postgres
      FRONT_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:3333
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CI: "true"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=\"-Xmx2048m -XX:MaxMetaspaceSize=512m\""
    depends_on:
      - database
      - app
      - web
    networks:
      - skynet


networks:
  skynet:
    driver: bridge

