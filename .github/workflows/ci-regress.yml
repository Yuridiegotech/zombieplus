name: CI – Regressão Docker‑Compose

on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 BRT (UTC-3)
  workflow_dispatch:               # permite execução manual a qualquer momento

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout application repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      #--- Checkout do repositório de testes (nome correto) ---
      - name: Checkout test suite repo
        uses: actions/checkout@v4
        with:
          repository: Yuridiegotech/zombieplus-Testes   # <-- nome correto do repo de testes
          path: tests-repo
          token: ${{ secrets.TESTS_PAT }}   # token com acesso ao repo privado

      - name: Prepare test suite folder
        run: |
          mkdir -p zombieplus
          cp -r tests-repo/* zombieplus/

      - name: Install npm dependencies (API)
        run: |
          cd app-repo/api
          npm install --omit=dev

      - name: Make Gradle wrapper executable
        run: |
          chmod +x zombieplus/gradlew
      # Playwright dependencies are now part of Dockerfile.tests

      - name: Bring up services (app + tests)
        working-directory: app-repo
        run: |
          docker compose -f docker-compose.yml \
                         -f docker-compose.ci.yml up --build --abort-on-container-exit

      - name: Wait for test container exit
        run: |
          docker wait zombieplus-tests

      - name: Gather test reports
        if: always()
        run: |
          mkdir -p reports/allure-results
          cp -r /tmp/ci-reports/* reports/ 2>/dev/null || true
          cp -r /tmp/ci-allure-results/* reports/allure-results/ 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/**

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java & Allure CLI
        if: always()
        run: |
          npm install -g allure-commandline --save-dev

      - name: Generate Allure Report with History
        if: always()
        run: |
          # 1. Copiar histórico anterior para allure-results para calcular o trend
          if [ -d "gh-pages/allure-report/latest/history" ]; then
            mkdir -p reports/allure-results/history
            cp -r gh-pages/allure-report/latest/history/* reports/allure-results/history/ 2>/dev/null || true
          elif [ -d "gh-pages/allure-report/history" ]; then
            mkdir -p reports/allure-results/history
            cp -r gh-pages/allure-report/history/* reports/allure-results/history/ 2>/dev/null || true
          fi

          # 2. Gerar o relatório Allure
          allure generate reports/allure-results --clean -o allure-report || true

      - name: Prepare GitHub Pages showcase portal
        if: always()
        run: |
          set -euo pipefail

          # ── 0. Proteção: só procede se o repositório principal foi baixado ──
          if [ ! -d "app-repo/portfolio" ]; then
            echo "Aviso: app-repo/portfolio não encontrado. Abortando preparação para não publicar página vazia."
            exit 1
          fi

          # ── 1. Copiar arquivos estáticos do portal portfolio ──
          mkdir -p gh-pages-deploy
          cp -r app-repo/portfolio/* gh-pages-deploy/

          # ── 2. Preservar relatórios e histórico anteriores do gh-pages ──
          mkdir -p gh-pages-deploy/allure-report
          if [ -d "gh-pages/allure-report" ]; then
            cp -r gh-pages/allure-report/* gh-pages-deploy/allure-report/ 2>/dev/null || true
          fi

          # ── 3. Publicar o relatório da execução atual em /latest e /<RUN_NUM> ──
          RUN_NUM="${{ github.run_number }}"
          if [ -d "allure-report" ] && [ -f "allure-report/index.html" ]; then
            mkdir -p gh-pages-deploy/allure-report/latest
            cp -r allure-report/* gh-pages-deploy/allure-report/latest/
            mkdir -p "gh-pages-deploy/allure-report/$RUN_NUM"
            cp -r allure-report/* "gh-pages-deploy/allure-report/$RUN_NUM/"

            # Copiar history-trend.json para a raiz de allure-report
            if [ -f "allure-report/widgets/history-trend.json" ]; then
              cp allure-report/widgets/history-trend.json gh-pages-deploy/allure-report/history-trend.json
            fi
          fi

          # ── 4. Manter no máximo os últimos 20 relatórios numéricos para economizar espaço ──
          if [ -d "gh-pages-deploy/allure-report" ]; then
            cd gh-pages-deploy/allure-report
            ls -d [0-9]* 2>/dev/null | sort -n | head -n -20 | xargs -r rm -rf || true
            cd ../..
          fi

          # ── 5. Gerar runs-manifest.json com as últimas 5 execuções ──
          PREV_MANIFEST=""
          if [ -f "gh-pages/allure-report/runs-manifest.json" ]; then
            PREV_MANIFEST=$(cat gh-pages/allure-report/runs-manifest.json)
          fi

          CURRENT_PASSED=0
          CURRENT_FAILED=0
          CURRENT_BROKEN=0
          CURRENT_SKIPPED=0
          CURRENT_TOTAL=0
          SUMMARY_FILE=""
          for f in \
            "allure-report/widgets/summary.json" \
            "gh-pages-deploy/allure-report/latest/widgets/summary.json"; do
            if [ -f "$f" ]; then
              SUMMARY_FILE="$f"
              break
            fi
          done

          if [ -n "$SUMMARY_FILE" ]; then
            CURRENT_PASSED=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('passed',0))" 2>/dev/null || echo 0)
            CURRENT_FAILED=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('failed',0))" 2>/dev/null || echo 0)
            CURRENT_BROKEN=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('broken',0))" 2>/dev/null || echo 0)
            CURRENT_SKIPPED=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('skipped',0))" 2>/dev/null || echo 0)
            CURRENT_TOTAL=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('total',0))" 2>/dev/null || echo 0)
          fi

          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build the new manifest with Python (merge + prepend current run, keep last 5)
          python3 -c "
          import json, sys

          prev_runs = []
          prev_raw = '''$PREV_MANIFEST'''
          if prev_raw.strip():
              try:
                  prev_data = json.loads(prev_raw)
                  prev_runs = prev_data.get('runs', [])
              except: pass

          current = {
              'buildNum': $RUN_NUM,
              'date': '$CURRENT_DATE',
              'passed': int('$CURRENT_PASSED' or 0),
              'failed': int('$CURRENT_FAILED' or 0) + int('$CURRENT_BROKEN' or 0),
              'skipped': int('$CURRENT_SKIPPED' or 0),
              'total': int('$CURRENT_TOTAL' or 0)
          }

          # Remove duplicate if same buildNum exists
          prev_runs = [r for r in prev_runs if r.get('buildNum') != $RUN_NUM]
          all_runs = [current] + prev_runs
          all_runs = all_runs[:5]

          manifest = {
              'lastUpdated': '$CURRENT_DATE',
              'runs': all_runs
          }
          print(json.dumps(manifest, indent=2))
          " > gh-pages-deploy/allure-report/runs-manifest.json

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy

      - name: Tear down Docker Compose
        if: always()
        run: |
          if [ -d "app-repo" ]; then
            cd app-repo
            docker compose -f docker-compose.yml \
                           -f docker-compose.ci.yml down -v
          fi
