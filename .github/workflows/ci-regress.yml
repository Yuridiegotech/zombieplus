name: CI – Regressão Docker‑Compose

on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 BRT (UTC‑3) – ajuste se quiser outro horário
  workflow_dispatch:               # permite execução manual a qualquer momento

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout application repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      #--- Checkout do repositório de testes (nome correto) ---
      - name: Checkout test suite repo
        uses: actions/checkout@v4
        with:
          repository: Yuridiegotech/zombieplus-Testes   # <-- nome correto do repo de testes
          path: tests-repo
          token: ${{ secrets.TESTS_PAT }}   # token com acesso ao repo privado

      - name: Prepare test suite folder
        run: |
          mkdir -p app-repo/../zombieplus
          cp -r tests-repo/* app-repo/../zombieplus/
      - name: Install npm dependencies (API)
        run: |
          cd app-repo/api
          npm install --omit=dev

      - name: Make Gradle wrapper executable
        run: |
          chmod +x app-repo/../zombieplus/gradlew
      - name: Install Playwright system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libx11-6 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxrandr2 libgbm1 libcairo2 libpango-1.0-0 libasound2t64

      - name: Bring up services (app + tests)
        working-directory: app-repo
        run: |
          docker compose -f docker-compose.yml \
                         -f docker-compose.ci.yml up --abort-on-container-exit

      - name: Wait for test container exit
        run: |
          docker wait zombieplus-tests

      - name: Gather test reports
        if: always()
        run: |
          mkdir -p reports
          cp -r /tmp/ci-reports/* reports/ || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/**

      - name: Tear down Docker Compose
        if: always()
        working-directory: app-repo
        run: |
          docker compose -f docker-compose.yml \
                         -f docker-compose.ci.yml down -v
