name: CI – Regressão Docker‑Compose

on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 BRT (UTC‑3) – ajuste se quiser outro horário
  workflow_dispatch:               # permite execução manual a qualquer momento

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout application repo
        uses: actions/checkout@v4
        with:
          path: app-repo

      #--- Checkout do repositório de testes (nome correto) ---
      - name: Checkout test suite repo
        uses: actions/checkout@v4
        with:
          repository: Yuridiegotech/zombieplus-Testes   # <-- nome correto do repo de testes
          path: tests-repo
          token: ${{ secrets.TESTS_PAT }}   # token com acesso ao repo privado

      - name: Prepare test suite folder
        run: |
          mkdir -p app-repo/../zombieplus
          cp -r tests-repo/* app-repo/../zombieplus/
      - name: Install npm dependencies (API)
        run: |
          cd app-repo/api
          npm install --omit=dev

      - name: Make Gradle wrapper executable
        run: |
          chmod +x app-repo/../zombieplus/gradlew
      # Playwright dependencies are now part of Dockerfile.tests

      - name: Bring up services (app + tests)
        working-directory: app-repo
        run: |
          docker compose -f docker-compose.yml \
                         -f docker-compose.ci.yml up --build --abort-on-container-exit

      - name: Wait for test container exit
        run: |
          docker wait zombieplus-tests

      - name: Gather test reports
        if: always()
        run: |
          mkdir -p reports
          cp -r /tmp/ci-reports/* reports/ || true
          mkdir -p reports/allure-results
          cp -r /tmp/ci-allure-results/* reports/allure-results/ || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/**

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report with History
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: reports/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Prepare GitHub Pages showcase portal
        if: always()
        run: |
          set -euo pipefail

          # ── 1. Copy portfolio static files ──
          mkdir -p gh-pages-deploy
          cp -r app-repo/portfolio/* gh-pages-deploy/

          # ── 2. Copy full allure-history (numbered folders + data) ──
          mkdir -p gh-pages-deploy/allure-report
          if [ -d "allure-history" ]; then
            cp -r allure-history/* gh-pages-deploy/allure-report/ 2>/dev/null || true
          fi

          # ── 2b. PRESERVE allure-history on gh-pages for next run ──
          # The simple-elf/allure-report-action looks for history at gh-pages/allure-history/
          # Without this, each run starts fresh and history is lost.
          mkdir -p gh-pages-deploy/allure-history
          if [ -d "allure-history" ]; then
            cp -r allure-history/* gh-pages-deploy/allure-history/ 2>/dev/null || true
          fi

          # ── 3. Create /allure-report/latest/ pointing to current run ──
          RUN_NUM="${{ github.run_number }}"
          LATEST_SRC=""
          if [ -d "allure-history/$RUN_NUM" ]; then
            LATEST_SRC="allure-history/$RUN_NUM"
          elif [ -d "allure-report" ] && [ -f "allure-report/index.html" ]; then
            LATEST_SRC="allure-report"
          fi
          if [ -n "$LATEST_SRC" ]; then
            rm -rf gh-pages-deploy/allure-report/latest
            mkdir -p gh-pages-deploy/allure-report/latest
            cp -r "$LATEST_SRC"/* gh-pages-deploy/allure-report/latest/
          fi

          # ── 4. Copy history-trend.json to root of allure-report ──
          find allure-history -name "history-trend.json" 2>/dev/null | head -n 1 | \
            xargs -I {} cp {} gh-pages-deploy/allure-report/history-trend.json || true

          # ── 5. Generate runs-manifest.json with the last 5 runs ──
          # Merge with previous manifest from gh-pages (if exists)
          PREV_MANIFEST=""
          if [ -f "gh-pages/allure-report/runs-manifest.json" ]; then
            PREV_MANIFEST=$(cat gh-pages/allure-report/runs-manifest.json)
          fi

          # Collect current run data from allure widgets
          CURRENT_PASSED=0
          CURRENT_FAILED=0
          CURRENT_BROKEN=0
          CURRENT_SKIPPED=0
          CURRENT_TOTAL=0
          SUMMARY_FILE=""
          for f in \
            "allure-report/widgets/summary.json" \
            "allure-history/$RUN_NUM/widgets/summary.json" \
            "gh-pages-deploy/allure-report/latest/widgets/summary.json"; do
            if [ -f "$f" ]; then
              SUMMARY_FILE="$f"
              break
            fi
          done

          if [ -n "$SUMMARY_FILE" ]; then
            CURRENT_PASSED=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('passed',0))" 2>/dev/null || echo 0)
            CURRENT_FAILED=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('failed',0))" 2>/dev/null || echo 0)
            CURRENT_BROKEN=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('broken',0))" 2>/dev/null || echo 0)
            CURRENT_SKIPPED=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('skipped',0))" 2>/dev/null || echo 0)
            CURRENT_TOTAL=$(python3 -c "import json; d=json.load(open('$SUMMARY_FILE')); s=d.get('statistic',{}); print(s.get('total',0))" 2>/dev/null || echo 0)
          fi

          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build the new manifest with Python (merge + prepend current run, keep last 5)
          python3 -c "
          import json, sys

          prev_runs = []
          prev_raw = '''$PREV_MANIFEST'''
          if prev_raw.strip():
              try:
                  prev_data = json.loads(prev_raw)
                  prev_runs = prev_data.get('runs', [])
              except: pass

          current = {
              'buildNum': $RUN_NUM,
              'date': '$CURRENT_DATE',
              'passed': int('$CURRENT_PASSED' or 0),
              'failed': int('$CURRENT_FAILED' or 0) + int('$CURRENT_BROKEN' or 0),
              'skipped': int('$CURRENT_SKIPPED' or 0),
              'total': int('$CURRENT_TOTAL' or 0)
          }

          # Remove duplicate if same buildNum exists
          prev_runs = [r for r in prev_runs if r.get('buildNum') != $RUN_NUM]
          all_runs = [current] + prev_runs
          all_runs = all_runs[:5]

          manifest = {
              'lastUpdated': '$CURRENT_DATE',
              'runs': all_runs
          }
          print(json.dumps(manifest, indent=2))
          " > gh-pages-deploy/allure-report/runs-manifest.json

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy

      - name: Tear down Docker Compose
        if: always()
        working-directory: app-repo
        run: |
          docker compose -f docker-compose.yml \
                         -f docker-compose.ci.yml down -v
