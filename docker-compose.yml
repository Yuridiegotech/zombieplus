# docker-compose.yml
# Version of Docker Compose (use a recent 3.x version)
version: "3.9"

name: zombieplus
services:
  # -------------------------------------------------
  # Banco de dados PostgreSQL (já existente)
  # -------------------------------------------------
  database:
    container_name: pgdb
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "zombieplus"       # banco criado automaticamente
      POSTGRES_USER: "postgres"       # opcional, default é "postgres"
      POSTGRES_PASSWORD: "pwd123"     # senha obrigatória
    ports:
      - "5432:5432"
    networks:
      - skynet

  # -------------------------------------------------
  # PgAdmin – interface web para o PostgreSQL
  # -------------------------------------------------
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@qax.com"
      PGADMIN_DEFAULT_PASSWORD: "pwd123"
    ports:
      - "16543:80"
    depends_on:
      - database
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço da aplicação (API + frontend) – caso a aplicação
  # já possua um Dockerfile ou seja construída via Gradle.
  # Se a aplicação não precisar ser executada para os testes, pode
  # ser removido; deixamos aqui como exemplo para quem quiser rodar
  # a API localmente.
  # -------------------------------------------------
  app:
    container_name: zombieplus-app
    build:
      context: .
      dockerfile: Dockerfile   # ajuste se o Dockerfile estiver em outro local
    ports:
      - "3333:3333"           # porta da API (ajuste conforme sua configuração)
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
    depends_on:
      - database
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço que executa a suite de testes regressivos.
  # Usa uma imagem oficial do Gradle (JDK 21 + Gradle 8).
  # Monta o código fonte e a pasta de testes (copiada a partir do
  # repositório de testes) e exporta os relatórios para o runner.
  # -------------------------------------------------
  tests:
    container_name: zombieplus-tests
    image: gradle:8.10-jdk21
    working_dir: /src
    # Montamos o código da aplicação (./) e a suite de testes (./tests)
    # e um volume temporário para guardar os relatórios gerados.
    volumes:
      - ./:/src
      - ./tests:/src/tests            # <- será preenchido na CI
      - /tmp/ci-reports:/src/build/reports
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
    depends_on:
      - database
    networks:
      - skynet
    command: ./gradlew test

networks:
  skynet:
    driver: bridge
