# docker-compose.yml
# Version of Docker Compose (use a recent 3.x version)
# Note: the "version" key is omitted to avoid deprecation warnings.

name: zombieplus
services:
  # -------------------------------------------------
  # Banco de dados PostgreSQL (já existente)
  # -------------------------------------------------
  database:
    container_name: pgdb
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "zombieplus"       # banco criado automaticamente
      POSTGRES_USER: "postgres"       # opcional, default é "postgres"
      POSTGRES_PASSWORD: "pwd123"     # senha obrigatória
    ports:
      - "5432:5432"
    networks:
      - skynet

  # -------------------------------------------------
  # PgAdmin – interface web para o PostgreSQL
  # -------------------------------------------------
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@qax.com"
      PGADMIN_DEFAULT_PASSWORD: "pwd123"
    ports:
      - "16543:80"
    depends_on:
      - database
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço da aplicação (API + frontend)
  # -------------------------------------------------
  app:
    container_name: zombieplus-app
    build:
      context: ./api            # Diretório onde está o Dockerfile da API
      dockerfile: Dockerfile    # Dockerfile localizado em api/Dockerfile
    ports:
      - "3333:3333"           # porta da API (ajuste se necessário)
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
      DB_DIALECT: postgres
      PORT: 3333
      FRONT_URL: http://zombieplus-app:3333
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:3333/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 12
    depends_on:
      - database
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço que executa a suite de testes regressivos.
  # Usa uma imagem oficial do Gradle (JDK 21 + Gradle 8).
  # Monta o código fonte da API e a pasta de testes (copiada a partir do
  # repositório de testes) e exporta os relatórios para o runner.
  # -------------------------------------------------
  tests:
    container_name: zombieplus-tests
    image: gradle:8.10-jdk21
    working_dir: /src
    volumes:
      - ./api:/src            # Monta o código da API
      - ./tests:/src/tests    # suite de testes
      - /tmp/ci-reports:/src/build/reports
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
      DB_DIALECT: postgres
    depends_on:
      - database
      - app
    networks:
      - skynet
    command: ./gradlew test

networks:
  skynet:
    driver: bridge
