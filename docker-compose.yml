# docker-compose.yml

name: zombieplus
services:
  # -------------------------------------------------
  # Banco de dados PostgreSQL
  # -------------------------------------------------
  database:
    container_name: pgdb
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "zombieplus"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "pwd123"
    ports:
      - "5432:5432"
    networks:
      - skynet

  # -------------------------------------------------
  # PgAdmin – interface web para o PostgreSQL
  # -------------------------------------------------
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@qax.com"
      PGADMIN_DEFAULT_PASSWORD: "pwd123"
    ports:
      - "16543:80"
    depends_on:
      - database
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço da API (Node.js Express)
  # -------------------------------------------------
  app:
    container_name: zombieplus-app
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
      DB_DIALECT: postgres
      PORT: 3333
      FRONT_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 5s
      timeout: 2s
      retries: 12
    depends_on:
      - database
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço do Frontend Web (React / serve)
  # -------------------------------------------------
  web:
    container_name: zombieplus-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - app
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço de Testes
  # -------------------------------------------------
  tests:
    container_name: zombieplus-tests
    image: gradle:8.10-jdk21
    working_dir: /src
    volumes:
      - ./api:/src
      - ./tests:/src/tests
      - /tmp/ci-reports:/src/build/reports
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/zombieplus
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pwd123
      DB_DIALECT: postgres
      FRONT_URL: http://web:3000
      BASE_URL: http://web:3000
    depends_on:
      - database
      - app
      - web
    networks:
      - skynet
    command: ./gradlew test

networks:
  skynet:
    driver: bridge
