# docker-compose.yml

name: zombieplus
services:
  # -------------------------------------------------
  # Banco de dados PostgreSQL
  # -------------------------------------------------
  database:
    container_name: pgdb
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "zombieplus"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "pwd123"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zombieplus"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - skynet

  # -------------------------------------------------
  # PgAdmin – interface web para o PostgreSQL
  # -------------------------------------------------
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@qax.com"
      PGADMIN_DEFAULT_PASSWORD: "pwd123"
    ports:
      - "16543:80"
    depends_on:
      - database
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço da API (Node.js Express)
  # -------------------------------------------------
  app:
    container_name: zombieplus-app
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      DB_DIALECT: postgres
      DB_HOST: database
      DB_NAME: zombieplus
      DB_USER: postgres
      DB_PASS: pwd123
      DB_PORT: 5432
      PORT: 3333
      FRONT_URL: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 3s
      timeout: 2s
      retries: 15
    depends_on:
      database:
        condition: service_healthy
    networks:
      - skynet

  # -------------------------------------------------
  # Serviço do Frontend Web (React / serve)
  # -------------------------------------------------
  web:
    container_name: zombieplus-web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - skynet



networks:
  skynet:
    driver: bridge
